<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busya 2048</title>
    <style>
        :root {
            /* Light Theme Variables */
            --bg-body: #faf8ef;
            --text-main: #776e65;
            --text-light: #f9f6f2;
            --bg-board: #bbada0;
            --bg-cell-empty: rgba(238, 228, 218, 0.35);
            --bg-btn: #8f7a66;
            --bg-btn-hover: #9f8b77;
            --bg-btn-active: #7f6a56;
            --bg-modal: rgba(255, 255, 255, 0.95);
            --border-modal: #eee4da;
            
            /* Tile Colors */
            --tile-2: #eee4da;
            --tile-4: #ede0c8;
            --tile-8: #f2b179;
            --tile-16: #f59563;
            --tile-32: #f67c5f;
            --tile-64: #f65e3b;
            --tile-128: #edcf72;
            --tile-256: #edcc61;
            --tile-512: #edc850;
            --tile-1024: #edc53f;
            --tile-2048: #edc22e;
            --tile-super: #3c3a32;

            --grid-size: 4; 
            --gap: 8px; 
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-body: #1a1a1a;
            --text-main: #e0e0e0;
            --bg-board: #333333;
            --bg-cell-empty: rgba(255, 255, 255, 0.1);
            --bg-btn: #555555;
            --bg-btn-hover: #666666;
            --bg-btn-active: #444444;
            --bg-modal: rgba(40, 40, 40, 0.95);
            --border-modal: #555;
            
            --tile-2: #4a453f;
            --tile-4: #524b42;
        }

        /* Custom Theme applies inline styles to root, so no class needed here */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
            overflow: hidden;
            padding: 10px;
        }

        /* RTL support for Arabic, Hebrew, Persian */
        body[dir="rtl"] {
            direction: rtl;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-main);
            padding: 5px;
            transition: transform 0.1s;
        }
        
        .btn-icon:active { transform: scale(0.9); }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .btn {
            background-color: var(--bg-btn);
            color: var(--text-light);
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex-grow: 1;
            text-align: center;
        }

        .btn:hover { background-color: var(--bg-btn-hover); }
        .btn:active { background-color: var(--bg-btn-active); transform: scale(0.95); }
        
        .btn.btn-stop { background-color: #d9534f; }
        .btn.btn-stop:hover { background-color: #c9302c; }
        .btn.btn-success { background-color: #5cb85c; }
        .btn.btn-success:hover { background-color: #4cae4c; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .stat-box {
            background-color: var(--bg-board);
            color: var(--text-light);
            border-radius: 6px;
            padding: 8px 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-title {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
        }

        .board-wrapper {
            position: relative;
            background-color: var(--bg-board);
            border-radius: 10px;
            padding: var(--gap);
            width: 100%;
            aspect-ratio: 1 / 1;
            touch-action: none;
        }

        .grid-background {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), 1fr);
            grid-template-rows: repeat(var(--grid-size), 1fr);
            gap: var(--gap);
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background-color: var(--bg-cell-empty);
            border-radius: 4px;
        }

        .tile-container {
            position: absolute;
            top: var(--gap);
            left: var(--gap);
            right: var(--gap);
            bottom: var(--gap);
            pointer-events: none;
        }

        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
            transition: transform 0.15s ease-in-out;
            width: calc((100% - (var(--gap) * (var(--grid-size) - 1))) / var(--grid-size));
            height: calc((100% - (var(--gap) * (var(--grid-size) - 1))) / var(--grid-size));
        }

        .tile-inner {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .tile-new .tile-inner { animation: appear 0.2s ease-in; }
        .tile-merged .tile-inner { animation: pop 0.2s ease-in-out; z-index: 20;}

        @keyframes appear { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .val-2 { background-color: var(--tile-2); color: #776e65; }
        .val-4 { background-color: var(--tile-4); color: #776e65; }
        .val-8 { background-color: var(--tile-8); color: #f9f6f2; }
        .val-16 { background-color: var(--tile-16); color: #f9f6f2; }
        .val-32 { background-color: var(--tile-32); color: #f9f6f2; }
        .val-64 { background-color: var(--tile-64); color: #f9f6f2; }
        .val-128 { background-color: var(--tile-128); color: #f9f6f2; }
        .val-256 { background-color: var(--tile-256); color: #f9f6f2; }
        .val-512 { background-color: var(--tile-512); color: #f9f6f2; }
        .val-1024 { background-color: var(--tile-1024); color: #f9f6f2; }
        .val-2048 { background-color: var(--tile-2048); color: #f9f6f2; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.33); }
        .val-super { background-color: var(--tile-super); color: #f9f6f2; }

        .footer {
            margin-top: auto;
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
            padding: 10px;
        }

        .footer a { color: var(--text-main); font-weight: bold; text-decoration: none;}

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--bg-modal);
            border: 2px solid var(--border-modal);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--text-main);
        }

        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-modal);
        }
        .settings-row:last-child { border-bottom: none; }
        
        select {
            padding: 5px;
            border-radius: 5px;
            background: var(--bg-btn);
            color: var(--text-light);
            border: none;
            outline: none;
            font-weight: bold;
        }
        
        .color-picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        
        input[type="color"] {
            border: none;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .lang-btn {
            background: var(--bg-btn);
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .lang-btn:active { transform: scale(0.9); }

        #easterEgg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        #easterEgg img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255,255,255,0.2);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        #easterEgg h1 { font-size: 3rem; font-family: cursive; text-shadow: 2px 2px 10px rgba(255,255,255,0.5); }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="header-buttons">
                <button class="btn-icon" id="btnTheme">☀️</button>
                <button class="btn-icon" id="btnLang">🇷🇺</button>
            </div>
            <div class="header-buttons">
                <button class="btn-icon" id="btnSettings">⚙️</button>
            </div>
        </div>

        <div class="controls" id="controlPanel">
            <button class="btn" id="btnRestart" data-i18n="restart">Начать заново</button>
            <button class="btn" id="btnHint" data-i18n="hint">Один ход за меня</button>
            <button class="btn" id="btnAuto" data-i18n="autoPlay">Играть за меня</button>
            <button class="btn btn-stop hidden" id="btnStopAuto" data-i18n="stopAuto">Алгоритм стоп</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-title" data-i18n="time">ВРЕМЯ</div>
                <div class="stat-value" id="valTime">00:00:00</div>
            </div>
            <div class="stat-box">
                <div class="stat-title" data-i18n="moves">ХОД</div>
                <div class="stat-value" id="valMoves">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title" data-i18n="score">СЧЁТ</div>
                <div class="stat-value" id="valScore">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-title" data-i18n="record">РЕКОРД</div>
                <div class="stat-value" id="valBestTile">0</div>
            </div>
        </div>

        <div class="board-wrapper" id="boardArea">
            <div class="grid-background" id="gridBg"></div>
            <div class="tile-container" id="tileContainer"></div>
        </div>

        <div class="footer">
            <span data-i18n="footerText">Мой проект на GitHub - </span><br>
            <a href="https://github.com/berestnevnikolaj671-kot/Busya-2048-game" target="_blank">https://github.com/berestnevnikolaj671-kot/Busya-2048-game</a>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="settingsTitle">Настройки</div>
            
            <button class="btn" id="btnShare" data-i18n="share">Поделиться приложением</button>
            <button class="btn" id="btnRate" data-i18n="rate">Оценить приложение</button>
            <button class="btn" id="btnDownload" data-i18n="download">Скачать HTML</button>
            <button class="btn btn-success" id="btnOpenThemeModal" data-i18n="createTheme">Создать тему</button>
            
            <div class="settings-row">
                <strong data-i18n="boardSize">Размер поля:</strong>
                <select id="sizeSelector">
                    <option value="2">2×2</option>
                    <option value="3">3×3</option>
                    <option value="4" selected>4×4</option>
                    <option value="5">5×5</option>
                    <option value="6">6×6</option>
                    <option value="7">7×7</option>
                    <option value="8">8×8</option>
                    <option value="9">9×9</option>
                </select>
            </div>
            
            <div class="settings-row" style="justify-content: center; cursor: pointer; user-select: none;" id="versionText">
                <span style="opacity: 0.6; font-size: 12px;"><span data-i18n="version">Версия приложения:</span> 1.0.2</span>
            </div>

            <button class="btn btn-stop" id="btnCloseSettings" data-i18n="close">Закрыть</button>
        </div>
    </div>

    <!-- Custom Theme Modal -->
    <div class="modal-overlay" id="customThemeModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="customTheme">Своя тема</div>
            
            <div class="color-picker-row">
                <span data-i18n="themeBg">Фон</span>
                <input type="color" id="colorBg" value="#faf8ef">
            </div>
            <div class="color-picker-row">
                <span data-i18n="themeText">Текст</span>
                <input type="color" id="colorText" value="#776e65">
            </div>
            <div class="color-picker-row">
                <span data-i18n="themeBoard">Поле</span>
                <input type="color" id="colorBoard" value="#bbada0">
            </div>
            <div class="color-picker-row">
                <span data-i18n="themeCell">Пустая ячейка</span>
                <input type="color" id="colorCell" value="#eee4da">
            </div>
            <div class="color-picker-row">
                <span data-i18n="themeBtn">Кнопки</span>
                <input type="color" id="colorBtn" value="#8f7a66">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-success" id="btnApplyTheme" data-i18n="apply">Применить</button>
                <button class="btn btn-stop" id="btnCancelTheme" data-i18n="cancel">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Language Modal -->
    <div class="modal-overlay" id="langModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="settingsTitle">Язык</div>
            <div class="lang-grid" id="langGrid">
                <!-- Buttons injected by JS -->
            </div>
            <button class="btn btn-stop" id="btnCloseLang" data-i18n="close">Закрыть</button>
        </div>
    </div>

    <!-- AI Modal -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal-content">
            <div class="modal-title" data-i18n="aiModalMsg" style="font-size: 16px;">Сохранить процесс алгоритма или вернуться к последнему своему ходу?</div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-success" id="btnKeepAi" data-i18n="keep">Сохранить</button>
                <button class="btn btn-stop" id="btnRevertAi" data-i18n="revert">Вернуться</button>
            </div>
        </div>
    </div>

    <!-- Easter Egg -->
    <div id="easterEgg">
        <img src="IMG-20260815-WA0002.jpg" alt="Busya" onerror="this.style.display='none'">
        <h1>By BusyaTM</h1>
    </div>

        };

        let currentLang = 'ru';
        let size = 4;
        let board = [];
        let tiles = []; 
        let tileIdCounter = 0;
        
        let score = 0;
        let maxTile = 0; 
        // Record is the highest tile ever collected across all games
        let bestMaxTile = parseInt(localStorage.getItem('busya2048BestMaxTile')) || 0; 
        let moves = 0;
        
        let startTime = null;
        let elapsedSeconds = 0;
        let timerInterval = null;
        let isGameOver = false;
        
        let aiInterval = null;
        let isAutoPlaying = false;
        let preAiState = null;

        const gridBg = document.getElementById('gridBg');
        const tileContainer = document.getElementById('tileContainer');
        const root = document.documentElement;
        
        function buildLangGrid() {
            const grid = document.getElementById('langGrid');
            grid.innerHTML = '';
            for (const [code, data] of Object.entries(i18n)) {
                const btn = document.createElement('button');
                btn.className = 'lang-btn';
                btn.textContent = data.flag;
                btn.title = code;
                btn.onclick = () => {
                    currentLang = code;
                    applyLanguage();
                    document.getElementById('langModal').classList.remove('active');
                };
                grid.appendChild(btn);
            }
        }
        buildLangGrid();

        function initGame() {
            root.style.setProperty('--grid-size', size);
            
            gridBg.innerHTML = '';
            for(let i=0; i<size*size; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                gridBg.appendChild(cell);
            }

            board = Array.from({ length: size }, () => Array(size).fill(0));
            tiles = [];
            score = 0;
            maxTile = 0;
            moves = 0;
            elapsedSeconds = 0;
            isGameOver = false;
            
            stopTimer();
            startTime = null;
            tileContainer.innerHTML = '';
            
            addRandomTile();
            addRandomTile();
            
            updateStatsDOM();
            renderBoard();
        }

        function getEmptyCells(currentBoard = board) {
            const empty = [];
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (currentBoard[r][c] === 0) empty.push({ r, c });
                }
            }
            return empty;
        }

        function addRandomTile() {
            const emptyCells = getEmptyCells();
            if (emptyCells.length > 0) {
                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const val = Math.random() < 0.9 ? 2 : 4;
                board[randomCell.r][randomCell.c] = val;
                
                updateMaxTile(val);

                tiles.push({
                    id: tileIdCounter++,
                    val: val,
                    row: randomCell.r,
                    col: randomCell.c,
                    isNew: true
                });
            }
        }

        function updateMaxTile(val) {
            if (val > maxTile) maxTile = val;
            if (val > bestMaxTile) {
                bestMaxTile = val;
                localStorage.setItem('busya2048BestMaxTile', bestMaxTile);
                updateStatsDOM();
            }
        }

        function move(direction, dryRun = false, currentBoard = board, currentScore = score) {
            let moved = false;
            let newScore = currentScore;
            
            let tilesToRemove = [];
            const vector = getVector(direction);
            const traversals = buildTraversals(vector);
            
            if (!dryRun) tiles.forEach(t => { t.isNew = false; t.isMerged = false; });

            traversals.x.forEach(x => {
                traversals.y.forEach(y => {
                    const cell = { r: x, c: y };
                    const tileVal = currentBoard[cell.r][cell.c];

                    if (tileVal !== 0) {
                        const positions = findFarthestPosition(cell, vector, currentBoard);
                        const next = positions.next;
                        const farthest = positions.farthest;

                        if (next.r >= 0 && next.r < size && next.c >= 0 && next.c < size && 
                            currentBoard[next.r][next.c] === tileVal && 
                            (!currentBoard[next.r][next.c].merged)) 
                        {
                            const mergedVal = tileVal * 2;
                            currentBoard[next.r][next.c] = { val: mergedVal, merged: true };
                            currentBoard[cell.r][cell.c] = 0;
                            newScore += mergedVal;
                            moved = true;
                            
                            if (!dryRun) {
                                updateMaxTile(mergedVal);
                                const movingTile = tiles.find(t => t.row === cell.r && t.col === cell.c && !tilesToRemove.includes(t.id));
                                const targetTile = tiles.find(t => t.row === next.r && t.col === next.c && !tilesToRemove.includes(t.id));
                                
                                if (movingTile && targetTile) {
                                    movingTile.row = next.r; movingTile.col = next.c;
                                    tilesToRemove.push(movingTile.id, targetTile.id);
                                    
                                    tiles.push({
                                        id: tileIdCounter++, val: mergedVal,
                                        row: next.r, col: next.c, isMerged: true
                                    });
                                }
                            }
                        } else if (farthest.r !== cell.r || farthest.c !== cell.c) {
                            currentBoard[farthest.r][farthest.c] = tileVal;
                            currentBoard[cell.r][cell.c] = 0;
                            moved = true;
                            
                            if (!dryRun) {
                                const movingTile = tiles.find(t => t.row === cell.r && t.col === cell.c && !tilesToRemove.includes(t.id));
                                if (movingTile) { movingTile.row = farthest.r; movingTile.col = farthest.c; }
                            }
                        }
                    }
                });
            });

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (typeof currentBoard[r][c] === 'object') currentBoard[r][c] = currentBoard[r][c].val;
                }
            }

            if (moved && !dryRun) {
                tiles = tiles.filter(t => !tilesToRemove.includes(t.id));
                score = newScore;
                moves++;
                addRandomTile();
                if (!startTime) startTimer();
                if (!movesAvailable(board)) { isGameOver = true; stopTimer(); }
            }

            return { moved, newScore };
        }

        function getVector(direction) {
            const map = { 0: { r: -1, c: 0 }, 1: { r: 0, c: 1 }, 2: { r: 1, c: 0 }, 3: { r: 0, c: -1 } };
            return map[direction];
        }

        function buildTraversals(vector) {
            const traversals = { x: [], y: [] };
            for (let pos = 0; pos < size; pos++) { traversals.x.push(pos); traversals.y.push(pos); }
            if (vector.r === 1) traversals.x.reverse();
            if (vector.c === 1) traversals.y.reverse();
            return traversals;
        }

        function findFarthestPosition(cell, vector, currentBoard) {
            let previous;
            let current = { r: cell.r, c: cell.c };
            do {
                previous = current;
                current = { r: previous.r + vector.r, c: previous.c + vector.c };
            } while (current.r >= 0 && current.r < size && current.c >= 0 && current.c < size && currentBoard[current.r][current.c] === 0);
            return { farthest: previous, next: current };
        }

        function movesAvailable(currentBoard) {
            if (getEmptyCells(currentBoard).length > 0) return true;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const val = currentBoard[r][c];
                    if ((r < size - 1 && currentBoard[r + 1][c] === val) || (c < size - 1 && currentBoard[r][c + 1] === val)) return true;
                }
            }
            return false;
        }

        function renderBoard() {
            const currentDomIds = Array.from(tileContainer.children).map(el => parseInt(el.dataset.id));
            const stateIds = tiles.map(t => t.id);
            
            currentDomIds.forEach(id => {
                if (!stateIds.includes(id)) {
                    const el = document.getElementById(`tile-${id}`);
                    if (el) el.remove();
                }
            });

            const baseFontSize = size <= 4 ? 30 : (size <= 6 ? 20 : 14);

            tiles.forEach(tile => {
                let el = document.getElementById(`tile-${tile.id}`);
                let inner = null;
                if (!el) {
                    el = document.createElement('div');
                    el.id = `tile-${tile.id}`;
                    el.dataset.id = tile.id;
                    el.className = 'tile';
                    inner = document.createElement('div');
                    inner.className = 'tile-inner';
                    el.appendChild(inner);
                    tileContainer.appendChild(el);
                } else {
                    inner = el.querySelector('.tile-inner');
                }

                el.style.left = `calc((${tile.col} * 100% / ${size}))`;
                el.style.top = `calc((${tile.row} * 100% / ${size}))`;

                const valClass = tile.val > 2048 ? 'val-super' : `val-${tile.val}`;
                el.className = `tile ${tile.isNew ? 'tile-new' : ''} ${tile.isMerged ? 'tile-merged' : ''}`;
                inner.className = `tile-inner ${valClass}`;
                
                let fSize = baseFontSize;
                if(tile.val > 100) fSize *= 0.8;
                if(tile.val > 1000) fSize *= 0.7;
                inner.style.fontSize = `${fSize}px`;

                if (tile.isNew) setTimeout(() => el.classList.remove('tile-new'), 200);
                if (tile.isMerged) setTimeout(() => el.classList.remove('tile-merged'), 200);

                inner.textContent = tile.val;
            });

            updateStatsDOM();
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            return [h, m, s].map(v => v < 10 ? "0" + v : v).join(":");
        }

        function updateStatsDOM() {
            document.getElementById('valScore').textContent = score;
            document.getElementById('valBestTile').textContent = bestMaxTile;
            document.getElementById('valMoves').textContent = moves;
            document.getElementById('valTime').textContent = formatTime(elapsedSeconds);
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                document.getElementById('valTime').textContent = formatTime(elapsedSeconds);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function cloneBoard(b) { return b.map(row => [...row]); }

        function generateWeightMatrix(s) {
            let matrix = [];
            for(let r=0; r<s; r++) {
                let row = [];
                for(let c=0; c<s; c++) {
                    let power = (s * s) - (r * s + (r % 2 === 0 ? c : s - 1 - c));
                    row.push(Math.pow(2, power)); 
                }
                matrix.push(row);
            }
            return matrix;
        }

        function evaluateBoard(testBoard, s) {
            const weights = generateWeightMatrix(s);
            let score = 0;
            let emptyCount = 0;
            for (let r = 0; r < s; r++) {
                for (let c = 0; c < s; c++) {
                    const val = testBoard[r][c];
                    if (val === 0) emptyCount++;
                    else score += val * weights[r][c];
                }
            }
            return score + (emptyCount * 100000); 
        }

        function getBestMoveDirection() {
            let bestScore = -1;
            let bestDir = -1;
            for (let dir = 0; dir < 4; dir++) {
                const testBoard = cloneBoard(board);
                const result = move(dir, true, testBoard, 0);
                if (result.moved) {
                    const evalScore = evaluateBoard(testBoard, size);
                    if (evalScore > bestScore) {
                        bestScore = evalScore;
                        bestDir = dir;
                    }
                }
            }
            return bestDir !== -1 ? bestDir : Math.floor(Math.random() * 4);
        }

        function performAiMove() {
            if (isGameOver) { stopAutoPlay(); return; }
            const bestDir = getBestMoveDirection();
            if (bestDir !== -1) {
                const { moved } = move(bestDir);
                if (moved) renderBoard();
            } else { stopAutoPlay(); }
        }

        function startAutoPlay() {
            if (isGameOver || isAutoPlaying) return;
            preAiState = {
                board: cloneBoard(board),
                tiles: JSON.parse(JSON.stringify(tiles)),
                score: score, moves: moves,
                elapsedSeconds: elapsedSeconds, tileIdCounter: tileIdCounter, maxTile: maxTile
            };
            isAutoPlaying = true;
            updateControlsVisibility();
            aiInterval = setInterval(() => { performAiMove(); }, 200); 
        }

        function stopAutoPlay() {
            if (!isAutoPlaying) return;
            isAutoPlaying = false;
            clearInterval(aiInterval);
            aiInterval = null;
            updateControlsVisibility();
            
            if (preAiState && moves > preAiState.moves) {
                document.getElementById('aiModal').classList.add('active');
            }
        }

        function revertToPreAiState() {
            if (preAiState) {
                board = preAiState.board; tiles = preAiState.tiles;
                score = preAiState.score; moves = preAiState.moves;
                elapsedSeconds = preAiState.elapsedSeconds; tileIdCounter = preAiState.tileIdCounter;
                maxTile = preAiState.maxTile;
                isGameOver = false;
                tileContainer.innerHTML = '';
                renderBoard();
                if (moves > 0 && !isGameOver) startTimer(); else stopTimer();
            }
            document.getElementById('aiModal').classList.remove('active');
            preAiState = null;
        }

        function applyLanguage() {
            const dict = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            document.getElementById('btnLang').textContent = dict.flag;
            document.body.setAttribute('dir', dict.dir || 'ltr');
            localStorage.setItem('busya2048Lang', currentLang);
        }

        let themeMode = 'light'; // light, dark, custom

        function clearCustomThemeStyles() {
            root.style.removeProperty('--bg-body');
            root.style.removeProperty('--text-main');
            root.style.removeProperty('--bg-board');
            root.style.removeProperty('--bg-cell-empty');
            root.style.removeProperty('--bg-btn');
        }

        function applyCustomColors() {
            const colors = JSON.parse(localStorage.getItem('busya2048CustomColors'));
            if(colors) {
                root.style.setProperty('--bg-body', colors.bg);
                root.style.setProperty('--text-main', colors.text);
                root.style.setProperty('--bg-board', colors.board);
                root.style.setProperty('--bg-cell-empty', colors.cell);
                root.style.setProperty('--bg-btn', colors.btn);
            }
        }

        function toggleTheme() {
            if (themeMode === 'light') {
                themeMode = 'dark';
                root.setAttribute('data-theme', 'dark');
                document.getElementById('btnTheme').textContent = '🌙';
                clearCustomThemeStyles();
            } else if (themeMode === 'dark') {
                themeMode = 'custom';
                root.setAttribute('data-theme', 'custom');
                document.getElementById('btnTheme').textContent = '🎨';
                if(!localStorage.getItem('busya2048CustomColors')) {
                    document.getElementById('customThemeModal').classList.add('active');
                } else {
                    applyCustomColors();
                }
            } else {
                themeMode = 'light';
                root.setAttribute('data-theme', 'light');
                document.getElementById('btnTheme').textContent = '☀️';
                clearCustomThemeStyles();
            }
            localStorage.setItem('busya2048Theme', themeMode);
        }

        function updateControlsVisibility() {
            document.getElementById('btnRestart').classList.toggle('hidden', isAutoPlaying);
            document.getElementById('btnHint').classList.toggle('hidden', isAutoPlaying);
            document.getElementById('btnAuto').classList.toggle('hidden', isAutoPlaying);
            document.getElementById('btnStopAuto').classList.toggle('hidden', !isAutoPlaying);
        }

        function handleInput(dir) {
            if (isGameOver || isAutoPlaying) return;
            const { moved } = move(dir);
            if (moved) requestAnimationFrame(() => renderBoard());
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': handleInput(0); break;
                case 'ArrowRight': case 'd': case 'D': handleInput(1); break;
                case 'ArrowDown': case 's': case 'S': handleInput(2); break;
                case 'ArrowLeft': case 'a': case 'A': handleInput(3); break;
            }
        });

        let touchStartX = 0; let touchStartY = 0;
        const boardArea = document.getElementById('boardArea');
        boardArea.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, {passive: false});
        boardArea.addEventListener('touchmove', e => { e.preventDefault(); }, {passive: false}); 
        boardArea.addEventListener('touchend', e => {
            if (isGameOver || isAutoPlaying) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) handleInput(dx > 0 ? 1 : 3);
                else handleInput(dy > 0 ? 2 : 0);
            }
        });

        document.getElementById('btnRestart').addEventListener('click', () => initGame());
        document.getElementById('btnHint').addEventListener('click', () => { if (!isGameOver && !isAutoPlaying) performAiMove(); });
        document.getElementById('btnAuto').addEventListener('click', startAutoPlay);
        document.getElementById('btnStopAuto').addEventListener('click', stopAutoPlay);
        
        document.getElementById('btnLang').addEventListener('click', () => document.getElementById('langModal').classList.add('active'));
        document.getElementById('btnCloseLang').addEventListener('click', () => document.getElementById('langModal').classList.remove('active'));
        document.getElementById('btnTheme').addEventListener('click', toggleTheme);
        
        document.getElementById('btnKeepAi').addEventListener('click', () => { document.getElementById('aiModal').classList.remove('active'); preAiState = null; });
        document.getElementById('btnRevertAi').addEventListener('click', revertToPreAiState);

        const settingsModal = document.getElementById('settingsModal');
        document.getElementById('btnSettings').addEventListener('click', () => settingsModal.classList.add('active'));
        document.getElementById('btnCloseSettings').addEventListener('click', () => settingsModal.classList.remove('active'));

        document.getElementById('sizeSelector').addEventListener('change', (e) => {
            size = parseInt(e.target.value);
            initGame();
        });
        
        const customThemeModal = document.getElementById('customThemeModal');
        document.getElementById('btnOpenThemeModal').addEventListener('click', () => {
            settingsModal.classList.remove('active');
            customThemeModal.classList.add('active');
            
            // load existing if any
            const colors = JSON.parse(localStorage.getItem('busya2048CustomColors'));
            if(colors) {
                document.getElementById('colorBg').value = colors.bg;
                document.getElementById('colorText').value = colors.text;
                document.getElementById('colorBoard').value = colors.board;
                document.getElementById('colorCell').value = colors.cell;
                document.getElementById('colorBtn').value = colors.btn;
            }
        });
        
        document.getElementById('btnCancelTheme').addEventListener('click', () => {
            customThemeModal.classList.remove('active');
            settingsModal.classList.add('active');
        });
        
        document.getElementById('btnApplyTheme').addEventListener('click', () => {
            const colors = {
                bg: document.getElementById('colorBg').value,
                text: document.getElementById('colorText').value,
                board: document.getElementById('colorBoard').value,
                cell: document.getElementById('colorCell').value,
                btn: document.getElementById('colorBtn').value
            };
            localStorage.setItem('busya2048CustomColors', JSON.stringify(colors));
            
            themeMode = 'custom';
            root.setAttribute('data-theme', 'custom');
            document.getElementById('btnTheme').textContent = '🎨';
            localStorage.setItem('busya2048Theme', 'custom');
            applyCustomColors();
            
            customThemeModal.classList.remove('active');
        });

        document.getElementById('btnShare').addEventListener('click', () => {
            const shareText = "Привет! Нашёл крутую игру 2048 без рекламы! Скачивай с GitHub - https://github.com/berestnevnikolaj671-kot/Busya-2048-game";
            if (navigator.share) {
                navigator.share({ text: shareText }).catch(err => console.log('Share error:', err));
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    const btn = document.getElementById('btnShare');
                    const orig = btn.innerText;
                    btn.innerText = currentLang === 'ru' ? "Скопировано!" : "Copied!";
                    setTimeout(() => btn.innerText = orig, 2000);
                });
            }
        });

        document.getElementById('btnRate').addEventListener('click', () => {
            window.open('https://forms.gle/HBbyZFPg5QtXvBi36', '_blank');
        });

        document.getElementById('btnDownload').addEventListener('click', () => {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Busya2048.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        let versionClicks = 0;
        let lastVersionClickTime = 0;
        document.getElementById('versionText').addEventListener('click', () => {
            const now = Date.now();
            if (now - lastVersionClickTime > 1000) versionClicks = 0; 
            lastVersionClickTime = now;
            versionClicks++;
            
            if (versionClicks === 7) {
                versionClicks = 0;
                settingsModal.classList.remove('active');
                const egg = document.getElementById('easterEgg');
                egg.style.display = 'flex';
                setTimeout(() => { egg.style.display = 'none'; }, 5000);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('busya2048Lang');
            if(savedLang && i18n[savedLang]) {
                currentLang = savedLang;
            } else {
                currentLang = 'ru';
            }
            applyLanguage();

            const savedTheme = localStorage.getItem('busya2048Theme');
            if (savedTheme) {
                themeMode = savedTheme;
                if(themeMode === 'custom') {
                    root.setAttribute('data-theme', 'custom');
                    document.getElementById('btnTheme').textContent = '🎨';
                    applyCustomColors();
                } else {
                    root.setAttribute('data-theme', savedTheme);
                    document.getElementById('btnTheme').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
                }
            }
            
            initGame();
        });

    </script>
</body>
</html>
